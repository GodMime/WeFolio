# 显式专用环境变量；不得使用 runtime .env。测试代码在建立连接前再次验证隔离声明及库名前缀。
spring:
  datasource:
    url: ${VISIT_ACTIVITY_MYSQL_URL}
    username: ${VISIT_ACTIVITY_MYSQL_USERNAME}
    password: ${VISIT_ACTIVITY_MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
# 另需 VISIT_ACTIVITY_MYSQL_ISOLATED=true，库名必须以 wefolio_visit_activity_test_ 开头且初始为空。

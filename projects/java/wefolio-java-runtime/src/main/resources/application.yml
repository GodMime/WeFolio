spring:
  application:
    name: wefolio-java-runtime

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jxc.wefolio.entity

server:
  address: 127.0.0.1
  port: 8090

# --- COS Configuration ---
cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  region: ${COS_REGION:ap-guangzhou}
  bucket-name: ${COS_BUCKET_NAME}
  public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.we-folio.dingchenyong.top}

# --- WeChat Mini Program Configuration ---
wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET}

# --- Admin Point Configuration ---
admin:
  point:
    secret: ${POINT_ADMIN_SECRET:}

spring:
  application:
    name: wefolio-java-runtime

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jxc.wefolio.entity

wefolio:
  mybatis:
    sql-log-enabled: ${WEFOLIO_MYBATIS_SQL_LOG_ENABLED:false}
  content-limit:
    work-image-max-count: ${WEFOLIO_WORK_IMAGE_MAX_COUNT:500}
    work-video-max-count: ${WEFOLIO_WORK_VIDEO_MAX_COUNT:100}
    work-animation-max-count: ${WEFOLIO_WORK_ANIMATION_MAX_COUNT:100}
    personal-portfolio-max-count: ${WEFOLIO_PERSONAL_PORTFOLIO_MAX_COUNT:10}
    team-portfolio-max-count: ${WEFOLIO_TEAM_PORTFOLIO_MAX_COUNT:10}
  work-audit:
    max-rounds: ${WEFOLIO_WORK_AUDIT_MAX_ROUNDS:3}
  team-portfolio:
    enabled: ${WEFOLIO_TEAM_PORTFOLIO_ENABLED:true}
  performance:
    portfolio-open:
      slow-threshold: ${PORTFOLIO_OPEN_SLOW_THRESHOLD:2s}
      normal-sample-rate: ${PORTFOLIO_OPEN_NORMAL_SAMPLE_RATE:0.01}

server:
  address: 127.0.0.1
  port: 8090

# --- COS Configuration ---
cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  region: ${COS_REGION:ap-guangzhou}
  bucket-name: ${COS_BUCKET_NAME}
  upload-base-url: ${COS_UPLOAD_BASE_URL:https://cos.we-folio.dingchenyong.top}
  public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.we-folio.dingchenyong.top}

# --- WeChat Mini Program Configuration ---
wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET}
    connect-timeout: ${WECHAT_MINIAPP_CONNECT_TIMEOUT:1s}
    read-timeout: ${WECHAT_MINIAPP_READ_TIMEOUT:3s}
  pay:
    enabled: ${WECHAT_PAY_ENABLED:false}
    merchant-id: ${WECHAT_PAY_MERCHANT_ID:}
    merchant-serial-number: ${WECHAT_PAY_MERCHANT_SERIAL_NUMBER:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    public-key-id: ${WECHAT_PAY_PUBLIC_KEY_ID:}
    public-key-path: ${WECHAT_PAY_PUBLIC_KEY_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:https://api.we-folio.dingchenyong.top/api/payment/wechat/recharge/notify}
    order-expire-minutes: ${WECHAT_PAY_ORDER_EXPIRE_MINUTES:15}
  virtual-payment:
    enabled: ${WECHAT_VIRTUAL_PAYMENT_ENABLED:false}
    offer-id: ${WECHAT_VIRTUAL_PAYMENT_OFFER_ID:}
    app-key: ${WECHAT_VIRTUAL_PAYMENT_APP_KEY:}
    session-encryption-secret: ${WECHAT_SESSION_ENCRYPTION_SECRET:}
    message-token: ${WECHAT_MESSAGE_TOKEN:}
    message-encoding-aes-key: ${WECHAT_MESSAGE_ENCODING_AES_KEY:}
    request-timeout: ${WECHAT_VIRTUAL_PAYMENT_REQUEST_TIMEOUT:5s}
    session-check-interval: ${WECHAT_SESSION_CHECK_INTERVAL:300s}
    settlement:
      delay: ${WECHAT_VIRTUAL_PAYMENT_SETTLEMENT_DELAY:10s}
      max-retries: ${WECHAT_VIRTUAL_PAYMENT_MAX_RETRIES:3}
      scan-interval: ${WECHAT_VIRTUAL_PAYMENT_SCAN_INTERVAL:10s}
      lease-duration: ${WECHAT_VIRTUAL_PAYMENT_LEASE_DURATION:60s}

point:
  lock:
    provider: ${POINT_LOCK_PROVIDER:local}

# --- Local Cache Configuration ---
cache:
  local:
    max-size: ${LOCAL_CACHE_MAX_SIZE:50000}

# --- Auth Token Configuration ---
auth:
  token:
    secret: ${AUTH_TOKEN_SECRET}
    visitor-expires-in-seconds: ${AUTH_TOKEN_VISITOR_EXPIRES_IN_SECONDS:2592000}

# --- Admin Point Configuration ---
admin:
  point:
    secret: ${ADMIN_POINT_SECRET:}

# --- Registration Point Configuration ---
registration:
  point:
    new-user-gift-points: ${REGISTRATION_NEW_USER_GIFT_POINTS:500}
    referral-gift-points: ${REGISTRATION_REFERRAL_GIFT_POINTS:500}

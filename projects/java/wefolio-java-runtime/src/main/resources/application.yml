spring:
  application:
    name: wefolio-java-runtime

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.jxc.wefolio.entity

wefolio:
  login:
    # 默认展示体验；配置为 maintainer 时默认展示登录 / 注册。
    default-tab: ${WEFOLIO_LOGIN_DEFAULT_TAB:experience}
  mybatis:
    sql-log-enabled: ${WEFOLIO_MYBATIS_SQL_LOG_ENABLED:false}
  content-limit:
    work-image-max-count: ${WEFOLIO_WORK_IMAGE_MAX_COUNT:500}
    work-video-max-count: ${WEFOLIO_WORK_VIDEO_MAX_COUNT:100}
    work-animation-max-count: ${WEFOLIO_WORK_ANIMATION_MAX_COUNT:100}
    personal-portfolio-max-count: ${WEFOLIO_PERSONAL_PORTFOLIO_MAX_COUNT:10}
    team-portfolio-max-count: ${WEFOLIO_TEAM_PORTFOLIO_MAX_COUNT:10}
  work-audit:
    max-rounds: ${WEFOLIO_WORK_AUDIT_MAX_ROUNDS:3}
    manual-review:
      webhook-url: ${FEISHU_WORK_AUDIT_WEBHOOK_URL:}
      webhook-secret: ${FEISHU_WORK_AUDIT_WEBHOOK_SECRET:}
      review-api-base-url: ${WORK_AUDIT_REVIEW_API_BASE_URL:https://api.we-folio.dingchenyong.top}
      connect-timeout: 2s
      read-timeout: 3s
  team-portfolio:
    enabled: ${WEFOLIO_TEAM_PORTFOLIO_ENABLED:true}
  performance:
    portfolio-open:
      slow-threshold: ${PORTFOLIO_OPEN_SLOW_THRESHOLD:2s}
      normal-sample-rate: ${PORTFOLIO_OPEN_NORMAL_SAMPLE_RATE:0.01}
  feedback:
    webhook-url: ${FEISHU_FEEDBACK_WEBHOOK_URL:}
    webhook-secret: ${FEISHU_FEEDBACK_WEBHOOK_SECRET:}
    status-api-base-url: ${FEEDBACK_STATUS_API_BASE_URL:https://api.we-folio.dingchenyong.top}
    connect-timeout: 2s
    read-timeout: 3s

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8090

# --- COS Configuration ---
cos:
  secret-id: ${COS_SECRET_ID}
  secret-key: ${COS_SECRET_KEY}
  region: ${COS_REGION:ap-guangzhou}
  bucket-name: ${COS_BUCKET_NAME}
  upload-base-url: ${COS_UPLOAD_BASE_URL:https://cos.we-folio.dingchenyong.top}
  public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.we-folio.dingchenyong.top}

# --- WeChat Mini Program Configuration ---
wechat:
  miniapp:
    app-id: ${WECHAT_MINIAPP_APP_ID}
    app-secret: ${WECHAT_MINIAPP_APP_SECRET}
    connect-timeout: ${WECHAT_MINIAPP_CONNECT_TIMEOUT:1s}
    read-timeout: ${WECHAT_MINIAPP_READ_TIMEOUT:3s}
  virtual-payment:
    enabled: ${WECHAT_VIRTUAL_PAYMENT_ENABLED:false}
    offer-id: ${WECHAT_VIRTUAL_PAYMENT_OFFER_ID:}
    app-key: ${WECHAT_VIRTUAL_PAYMENT_APP_KEY:}
    session-encryption-secret: ${WECHAT_SESSION_ENCRYPTION_SECRET:}
    message-token: ${WECHAT_MESSAGE_TOKEN:}
    message-encoding-aes-key: ${WECHAT_MESSAGE_ENCODING_AES_KEY:}
    request-timeout: ${WECHAT_VIRTUAL_PAYMENT_REQUEST_TIMEOUT:5s}
    session-check-interval: ${WECHAT_SESSION_CHECK_INTERVAL:300s}
    settlement:
      delay: ${WECHAT_VIRTUAL_PAYMENT_SETTLEMENT_DELAY:10s}
      max-retries: ${WECHAT_VIRTUAL_PAYMENT_MAX_RETRIES:3}
      lease-duration: ${WECHAT_VIRTUAL_PAYMENT_LEASE_DURATION:60s}

# --- Redis 配置 ---
redis:
  enabled: true
  address: ${REDIS_ADDRESS}
  password: ${REDIS_PASSWORD:}
  database: ${REDIS_DATABASE:0}
  key-prefix: ${REDIS_KEY_PREFIX:wefolio:runtime:}
  connect-timeout: ${REDIS_CONNECT_TIMEOUT:3s}
  command-timeout: ${REDIS_COMMAND_TIMEOUT:3s}

# --- Auth Token Configuration ---
auth:
  token:
    secret: ${AUTH_TOKEN_SECRET}
    visitor-expires-in-seconds: ${AUTH_TOKEN_VISITOR_EXPIRES_IN_SECONDS:2592000}

# --- Admin Point Configuration ---
admin:
  point:
    secret: ${ADMIN_POINT_SECRET:}

# --- Registration Point Configuration ---
registration:
  point:
    new-user-gift-points: ${REGISTRATION_NEW_USER_GIFT_POINTS:1000}
    referral-gift-points: ${REGISTRATION_REFERRAL_GIFT_POINTS:500}

# 官方原码环境；名片在手机端合成。
portfolio:
  miniapp-code:
    env-version: ${PORTFOLIO_MINIAPP_CODE_ENV_VERSION:release}
    check-path: ${PORTFOLIO_MINIAPP_CODE_CHECK_PATH:true}
  # 字体默认关闭；预校验通过并完成双节点准入后再开放。
  fonts:
    enabled: ${PORTFOLIO_FONTS_ENABLED:false}
    validation-enabled: ${PORTFOLIO_FONTS_VALIDATION_ENABLED:false}
    cleanup-enabled: ${PORTFOLIO_FONTS_CLEANUP_ENABLED:true}
    prepare-budget-ms: ${PORTFOLIO_FONTS_PREPARE_BUDGET_MS:2000}
    delete-budget-ms: ${PORTFOLIO_FONTS_DELETE_BUDGET_MS:1000}
    concurrency: ${PORTFOLIO_FONTS_CONCURRENCY:2}
    max-output-bytes: ${PORTFOLIO_FONTS_MAX_OUTPUT_BYTES:8388608}
    directory: ${PORTFOLIO_FONTS_DIRECTORY:${java.io.tmpdir}/wefolio-fonts}
    python: ${PORTFOLIO_FONTS_PYTHON:python3}
    harfbuzz: ${PORTFOLIO_FONTS_HARFBUZZ:hb-subset}
    toolchain-hash: ${PORTFOLIO_FONTS_TOOLCHAIN_HASH:}
    expected-build-id: ${PORTFOLIO_FONTS_EXPECTED_BUILD_ID:}
    alert:
      enabled: ${PORTFOLIO_FONTS_ALERT_ENABLED:false}
      webhook-url: ${PORTFOLIO_FONTS_ALERT_WEBHOOK_URL:}
      webhook-secret: ${PORTFOLIO_FONTS_ALERT_WEBHOOK_SECRET:}
      node-id: ${PORTFOLIO_FONTS_ALERT_NODE_ID:runtime}

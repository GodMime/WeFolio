spring:
  datasource:
    # H2 内存数据库，MySQL 兼容模式，进程内共享。
    url: jdbc:h2:mem:wefolio_job_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: never

mybatis-plus:
  configuration:
    # 测试环境关闭 SQL 日志，保持输出干净。
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true

server:
  port: 18091
  servlet:
    # 测试环境保持和正式配置一致的 job 接口前缀。
    context-path: /job-api

cos:
  # 测试环境只用于属性绑定，不调用真实腾讯云接口。
  secret-id: test-secret-id
  secret-key: test-secret-key
  region: ap-guangzhou
  bucket-name: test-bucket
  upload-base-url: https://test.cos.example.com
  public-base-url: https://test.cos.example.com

work-audit:
  # 单元测试默认关闭调度触发，只测试显式调用。
  enabled: false
  cron: "0 * * * * ?"
  lock-owner-prefix: test
  task-lock-seconds: 300
  max-query-video-per-run: 1000
  max-submit-video-per-run: 500
  max-audit-image-per-run: 500
  video-query-max-attempts: 120
  video-snapshot-interval-seconds: 60
  max-video-snapshot-count: 120
  remote-call-timeout-seconds: 30

admin:
  point:
    secret: test-admin-point-secret

work-storage-billing:
  enabled: false
  cron: "0 0 2 1 * ?"
  zone: Asia/Shanghai
  batch-size: 100

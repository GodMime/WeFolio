spring:
  application:
    name: wefolio-java-job

  datasource:
    # 数据库连接地址，参考 wefolio-java-runtime。
    url: ${DB_URL}
    # 数据库用户名，参考 wefolio-java-runtime。
    username: ${DB_USERNAME}
    # 数据库密码，参考 wefolio-java-runtime。
    password: ${DB_PASSWORD}
    # MySQL JDBC 驱动。
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    # 开启下划线字段到 Java 驼峰字段的自动映射。
    map-underscore-to-camel-case: true
  # Mapper XML 扫描路径，和 runtime 保持同类结构。
  mapper-locations: classpath:mapper/**/*.xml
  # job 工程实体包路径。
  type-aliases-package: com.jxc.wefolio.job.entity

wefolio:
  mybatis:
    # MyBatis SQL 日志开关，默认关闭。
    sql-log-enabled: ${WEFOLIO_MYBATIS_SQL_LOG_ENABLED:false}
  runtime:
    # runtime 单用户月费结算 HTTPS 根地址。
    base-url: ${WEFOLIO_RUNTIME_BASE_URL:}

server:
  # 默认只监听本机地址，和 runtime 保持一致。
  address: 127.0.0.1
  # job 工程默认端口。
  port: 8091
  servlet:
    # job 工程所有 Web 接口统一使用 /job-api 前缀，便于 nginx 和 runtime 的 /api 路由隔离。
    context-path: /job-api

cos:
  # 腾讯云访问密钥 ID，参考 wefolio-java-runtime。
  secret-id: ${COS_SECRET_ID}
  # 腾讯云访问密钥 Secret，参考 wefolio-java-runtime。
  secret-key: ${COS_SECRET_KEY}
  # COS 地域。
  region: ${COS_REGION:ap-guangzhou}
  # COS 存储桶名称。
  bucket-name: ${COS_BUCKET_NAME}
  # 小程序直传上传域名；job 当前不直传，但保留同名配置以复用配置约定。
  upload-base-url: ${COS_UPLOAD_BASE_URL:https://cos.we-folio.dingchenyong.top}
  # COS 或 CDN 对外访问域名。
  public-base-url: ${COS_PUBLIC_BASE_URL:https://cos.we-folio.dingchenyong.top}

work-audit:
  # 是否启用作品审核定时任务。
  enabled: true
  # 作品审核任务调度表达式；默认每分钟第 0 秒执行一次。
  cron: "0 * * * * ?"
  # 当前 job 实例锁标识前缀；默认使用主机名，便于排查是哪台实例 claim 了任务。
  lock-owner-prefix: ${HOSTNAME:local}
  # 单条审核任务锁定秒数；必须大于单次腾讯云远端调用超时时间。
  task-lock-seconds: 300
  # 每轮最多查询多少条未结束的视频审核任务；默认先放大，后续可按积压和耗时调小。
  max-query-video-per-run: 1000
  # 每轮最多提交多少个未审核视频作品到腾讯云异步审核；提交后不等待结果。
  max-submit-video-per-run: 500
  # 单个视频提交任务最多尝试次数，约束进程中断后的原任务重提。
  video-submit-max-attempts: ${WEFOLIO_WORK_AUDIT_VIDEO_SUBMIT_MAX_ATTEMPTS:3}
  # 每轮最多同步审核多少个未审核图片作品。
  max-audit-image-per-run: 500
  # 单个图片审核任务最多尝试次数，用于进程中断后的原任务恢复。
  image-max-attempts: ${WEFOLIO_WORK_AUDIT_IMAGE_MAX_ATTEMPTS:3}
  # 每轮最多尝试审核多少个动图任务。
  max-audit-animation-per-run: ${WEFOLIO_WORK_AUDIT_MAX_ANIMATION_PER_RUN:500}
  # 单个动图任务最多尝试次数，重试复用已持久化的抽样帧。
  animation-max-attempts: ${WEFOLIO_WORK_AUDIT_ANIMATION_MAX_ATTEMPTS:3}
  # 单个视频审核任务最多主动查询次数；每分钟查一次时，120 次约等于 2 小时。
  video-query-max-attempts: 120
  # 视频画面审核截帧间隔秒数；当前只做画面审核，不做音频审核。
  video-snapshot-interval-seconds: 60
  # 单个视频最多截帧数量，防止超长视频产生过多审核帧。
  max-video-snapshot-count: 120
  # 腾讯云远端接口调用超时时间，单位秒。
  remote-call-timeout-seconds: 30

admin:
  point:
    # 复用 Runtime 人工加分接口的后台积分密钥。
    secret: ${ADMIN_POINT_SECRET:}

job-scheduling:
  # 发布旧服务前等待当前后台工作自然结束的最长时间。
  disable-timeout: ${JOB_SCHEDULING_DISABLE_TIMEOUT:10s}
  # 发布期间暂停接收新后台工作的时长，到期后惰性自动恢复。
  pause-duration: ${JOB_SCHEDULING_PAUSE_DURATION:10m}

user-storage-folder-repair:
  # 历史用户目录修复 ID 游标批大小，批内严格逐个处理。
  batch-size: ${USER_STORAGE_FOLDER_REPAIR_BATCH_SIZE:200}

work-storage-billing:
  # 是否启用每月作品存储结算调度。
  enabled: ${WORK_STORAGE_BILLING_ENABLED:true}
  # 每月 1 日凌晨 2 点执行。
  cron: "${WORK_STORAGE_BILLING_CRON:0 0 2 1 * ?}"
  # 账期和调度统一采用上海时区。
  zone: ${WORK_STORAGE_BILLING_ZONE:Asia/Shanghai}
  # 单次游标扫描用户数。
  batch-size: ${WORK_STORAGE_BILLING_BATCH_SIZE:500}

recharge-order-close:
  # 是否启用过期充值订单关闭任务。
  enabled: ${RECHARGE_ORDER_CLOSE_ENABLED:true}
  # 与整分钟任务错开，默认每分钟第 30 秒执行。
  cron: "${RECHARGE_ORDER_CLOSE_CRON:30 * * * * ?}"
  # 订单过期判断与调度统一采用上海时区。
  zone: ${RECHARGE_ORDER_CLOSE_ZONE:Asia/Shanghai}
  # 单批最多关闭的订单数。
  batch-size: ${RECHARGE_ORDER_CLOSE_BATCH_SIZE:200}
  # 单轮最多执行的批次数，防止长期占用任务线程。
  max-batches: ${RECHARGE_ORDER_CLOSE_MAX_BATCHES:10}

feedback-upload-cleanup:
  # 是否启用反馈附件过期清理任务。
  enabled: ${FEEDBACK_UPLOAD_CLEANUP_ENABLED:true}
  # 每日凌晨 3:40 低峰执行，避免占用白天业务资源。
  cron: "${FEEDBACK_UPLOAD_CLEANUP_CRON:0 40 3 * * ?}"
  # cron 调度时区，不影响按上海业务时区解释的过期时间。
  zone: ${FEEDBACK_UPLOAD_CLEANUP_ZONE:Asia/Shanghai}
  # 单轮最多读取并逐条清理的上传任务数量。
  batch-size: ${FEEDBACK_UPLOAD_CLEANUP_BATCH_SIZE:200}
  # 单轮最多执行的 keyset 批次数，防止长期占用清理线程。
  max-batches: ${FEEDBACK_UPLOAD_CLEANUP_MAX_BATCHES:10}

virtual-payment-dispatch:
  # Release A 默认关闭；确认所有 runtime 实例均已提供单任务接口后再启用。
  enabled: ${VIRTUAL_PAYMENT_DISPATCH_ENABLED:false}
  # 上一轮赠送订单分发完成后的固定扫描延迟。
  gift-scan-interval: ${VIRTUAL_PAYMENT_GIFT_DISPATCH_INTERVAL:60s}
  # 上一轮待扣任务分发完成后的固定扫描延迟。
  debit-scan-interval: ${VIRTUAL_PAYMENT_DEBIT_DISPATCH_INTERVAL:30s}
  # 每类候选单轮最多读取数量。
  batch-size: ${VIRTUAL_PAYMENT_DISPATCH_BATCH_SIZE:100}
  # 单轮分发固定工作线程数。
  worker-count: ${VIRTUAL_PAYMENT_DISPATCH_WORKER_COUNT:4}
  # 单次 runtime 请求连接和读取超时，不在同一轮自动重试。
  request-timeout: ${VIRTUAL_PAYMENT_DISPATCH_REQUEST_TIMEOUT:30s}
